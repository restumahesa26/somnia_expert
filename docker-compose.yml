version: '3.8'

services:
  # 1. Service Aplikasi (PHP)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: somnia_expert_app
    container_name: somnia_expert_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - laravel-net

  # 2. Service Web Server (Nginx)
  webserver:
    image: nginx:alpine
    container_name: laravel-nginx
    restart: unless-stopped
    ports:
      - "8080:80"  # Kita akses via localhost:8080
    volumes:
      - ./:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel-net

  # 3. Service Database (MySQL)
  db:
    image: mysql:8.0
    container_name: laravel-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: somnia_expert
      MYSQL_ROOT_PASSWORD: rahasia
      # HAPUS baris MYSQL_USER dan MYSQL_PASSWORD
      # Kita tidak butuh user tambahan, karena kita pakai root
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - laravel-net

networks:
  laravel-net:
    driver: bridge

volumes:
  dbdata:
